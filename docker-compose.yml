version: '3.8'

services:
  sidecar:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./config/resilience.yaml:/config/resilience.yaml
      - semaphore-data:/data
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/config/resilience.yaml
    depends_on:
      - mock-service

  mock-service:
    build: ./mock-service
    ports:
      - "3001:3000"

volumes:
  semaphore-data:
